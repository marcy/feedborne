<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>feedborne</title>
<style>
  :root {
    --bg: #101014;
    --panel: #1a1a21;
    --line: #2c2c38;
    --text: #e8e2d4;
    --muted: #8f8a7a;
    --gold: #c9a227;
    --gold-dim: #6e5a15;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    position: sticky; top: 0; background: var(--bg); z-index: 10;
  }
  header h1 {
    font-size: 20px; margin: 0; letter-spacing: .14em; color: var(--gold);
    font-family: Georgia, "Times New Roman", serif; font-weight: 600;
  }
  header .unread { color: var(--muted); font-size: 13px; }
  header .keys { color: var(--muted); font-size: 12px; margin-left: auto; }
  header .keys kbd {
    background: var(--panel); border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 5px; font-family: inherit; color: var(--text);
  }
  .feeds {
    padding: 8px 20px; border-bottom: 1px solid var(--line);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px;
  }
  .feeds .name { color: var(--muted); }
  .feeds form { margin-left: auto; display: flex; gap: 6px; }
  .feeds input[type="url"] {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 4px; padding: 4px 8px; width: 280px;
  }
  .feeds button {
    background: var(--panel); border: 1px solid var(--gold-dim); color: var(--gold);
    border-radius: 4px; padding: 4px 10px; cursor: pointer;
  }
  main { max-width: 860px; margin: 0 auto; padding: 10px 14px 60px; }
  .entry {
    padding: 12px 14px; border: 1px solid transparent; border-bottom: 1px solid var(--line);
    cursor: default;
  }
  .entry .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; }
  .entry h2 { font-size: 16px; margin: 4px 0 4px; font-weight: 600; line-height: 1.45; }
  .entry h2 a { color: var(--text); text-decoration: none; }
  .entry p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.55; }
  .entry.read h2 a, .entry.read p { color: var(--muted); }
  .entry.selected {
    background: var(--panel); border: 1px solid var(--gold-dim); border-radius: 6px;
    box-shadow: inset 3px 0 0 var(--gold);
  }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>FEEDBORNE</h1>
  <span class="unread">未読 {{.Unread}} 件</span>
  <span class="keys"><kbd>j</kbd> 次へ <kbd>k</kbd> 前へ <kbd>o</kbd> 別タブで開く</span>
</header>
<div class="feeds">
  {{range .Feeds}}<span class="name">{{if .Title}}{{.Title}}{{else}}{{.URL}}{{end}}</span>{{end}}
  <form method="post" action="/feeds">
    <input type="url" name="url" placeholder="https://example.com/feed.rss" required>
    <button type="submit">フィード追加</button>
  </form>
</div>
<main id="list">
  {{range .Entries}}
  <article class="entry{{if .Read}} read{{end}}" data-id="{{.ID}}" data-url="{{.URL}}">
    <div class="meta"><span>{{.FeedTitle}}</span><span>{{fmtTime .PublishedAt}}</span></div>
    <h2><a href="{{.URL}}" target="_blank" rel="noopener">{{.Title}}</a></h2>
    {{if .Description}}<p>{{short .Description 140}}</p>{{end}}
  </article>
  {{else}}
  <div class="empty">まだ記事がありません。<code>feedborne crawl</code> を実行してください。</div>
  {{end}}
</main>
<script>
(function () {
  var entries = Array.prototype.slice.call(document.querySelectorAll('.entry'));
  if (!entries.length) return;
  var idx = 0;
  function select(i) {
    entries[idx].classList.remove('selected');
    idx = Math.max(0, Math.min(entries.length - 1, i));
    entries[idx].classList.add('selected');
    entries[idx].scrollIntoView({ block: 'nearest' });
  }
  entries[0].classList.add('selected');
  document.addEventListener('keydown', function (e) {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.key === 'j') {
      select(idx + 1);
    } else if (e.key === 'k') {
      select(idx - 1);
    } else if (e.key === 'o') {
      var el = entries[idx];
      var url = el.getAttribute('data-url');
      var id = el.getAttribute('data-id');
      window.open(url, '_blank', 'noopener');
      el.classList.add('read');
      var body = new URLSearchParams({ id: id });
      fetch('/read', { method: 'POST', body: body }).catch(function () {});
    }
  });
})();
</script>
</body>
</html>
